# GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Improve BLE range to hosts and the wireless link between keyboard halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y

# Trackball
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y    
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_CPI=900
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_SNIPE_CPI=450
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=2
CONFIG_PMW3610_SCROLL_TICK=2
CONFIG_PMW3610_POLLING_RATE_125_SW=y
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=0
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=0
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS
#CONFIG_PMW3610_ORIENTATION_0=y
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
#CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=600


# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# OS Auto Layer Switching
CONFIG_ZMK_BEHAVIOR_OS_LAYER=y

# LineaStudioオーバーレイ用: レイヤー状態GATT通知
CONFIG_ZMK_LAYER_STATUS_GATT=y

# Studio の実行時編集は従来どおり常時アンロック。
CONFIG_ZMK_STUDIO_LOCKING=n

# USB HID と Studio RPC は引き続き有効。
CONFIG_ZMK_USB=y
# 複数ホスト接続時の入力停止は OS レイヤー切替の起動時競合を調査中。
# Mac単独の検証では無効化後にUSB/BLE入力と再起動後の復帰を確認した。
# ただし複数ホストでの入力停止は7月4日版でも再現したため、
# USBホストOS判別を唯一の原因とは判断できない。再調査まで無効を維持する。
# 有線接続時のOS/JISレイヤーは選択中のBTプロファイルに従う。
CONFIG_ZMK_USB_HOST_OS_DETECTION=n

# フィンガープリント計測も無効化。両方 n のため USB ep_read の wrap はリンクしない。
CONFIG_ZMK_USB_FP_CAPTURE=n
