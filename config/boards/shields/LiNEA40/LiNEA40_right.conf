# GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y

# Trackball
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y    
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_CPI=900
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_SNIPE_CPI=450
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=2
CONFIG_PMW3610_SCROLL_TICK=2
CONFIG_PMW3610_POLLING_RATE_125_SW=y
#CONFIG_PMW3610_FORCE_AWAKE=n
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=0
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=0
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS
#CONFIG_PMW3610_ORIENTATION_0=y
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
#CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=600


# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# OS Auto Layer Switching
CONFIG_ZMK_BEHAVIOR_OS_LAYER=y

# LineaStudioオーバーレイ用: レイヤー状態GATT通知
CONFIG_ZMK_LAYER_STATUS_GATT=y

# ZMK Studio: ロック機構を無効化（常時アンロック）
# 既定ではアイドル600秒・切断時に再ロックされ都度 &studio_unlock が必要だった。
# 個人利用・接続はボンド済みホストのみのため無効化する（v0.2.1 core.c:
# LOCKING無効時は初期状態からUNLOCKEDで、ロックへ遷移する経路なし）
CONFIG_ZMK_STUDIO_LOCKING=n

# USB有線ホストOS判別 → デフォルトレイヤー自動切替（本実装）
# ZMK_USB は xiao_ble/central では既定でon（battery_typeがUSBでタイプ実績あり）だが、
# 依存が満たされないと ZMK_USB_HOST_OS_DETECTION がサイレントに n へ解決するため、
# 依存を明示して判別経路のビルドを保証する。
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_HOST_OS_DETECTION=y

# フィンガープリント計測は完了につき無効化（デバッグ機能・将来のiPad計測用に残置）。
# usb_dc_ep_read の --wrap は usb_host_os.c が単独所有するため、これを=nにしても
# 判別経路のwrapは維持される。keymapの &usb_fp_type バインドは &trans へ戻し済み。
CONFIG_ZMK_USB_FP_CAPTURE=n
